version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - landing
      - users-microservice
      - backend-data-intake
    restart: unless-stopped
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
  users-microservice:
    build:
      context: ./users-microservice
      dockerfile: Dockerfile
    expose:
      - "4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
    env_file:
      - .env.production
    depends_on:
      - redis
    restart: unless-stopped
  backend-data-intake:
    build:
      context: ./backend-data-intake
      dockerfile: Dockerfile
    expose:
      - "3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env.production
    depends_on:
      - redis
    volumes:
      - intake_logs:/app/logs
      - intake_uploads:/app/uploads
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
volumes:
  redis_data:
  intake_logs:
  intake_uploads:
