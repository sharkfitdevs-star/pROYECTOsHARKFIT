            function validarUrlAtualeRedirecionar() {
                var url = window.location.href;
                if (url.indexOf('evo5.w12app.com.br') == -1
                    && url.indexOf('evotribes') == -1
                    && url.indexOf('release') == -1
                    && url.indexOf('feature') == -1
                    && url.indexOf('homolog') == -1
                    && url.indexOf('localhost') == -1
                    && url.indexOf('127.0.0.1') == -1
                    && url.indexOf('pre-prod') == -1
                ) {
                    var domain = window.location.host.split('.')[0];
                    //var domain = 'w12.w12app.com.br'.split('.')[0];
                    var xmlHttp = new XMLHttpRequest();
                    //xmlHttp.open("GET", 'http://localhost:6918/api/v1/auth/verificar-url-redirect?dnsAtual=' + domain, false);
                    xmlHttp.open("GET", 'https://evo-abc-api.w12app.com.br/api/v1/auth/verificar-url-redirect?dnsAtual=' + domain, false);
                    xmlHttp.send(null);
                    var retorno =  xmlHttp.responseText;
                    if(retorno != null && retorno != '')
                        window.location.href = retorno;
                }
            }

            (function () {
                var per_app_intercom_widget;

                function getAppId() {
                    if (typeof window.intercomSettings !== 'undefined' &&
                        typeof (window.intercomSettings.app_id) !== 'undefined') {
                        return window.intercomSettings.app_id
                    } else if (typeof window.analytics !== 'undefined' &&
                        typeof window.analytics._integrations !== 'undefined' &&
                        typeof analytics._integrations.Intercom !== 'undefined' &&
                        typeof analytics._integrations.Intercom.options !== 'undefined' &&
                        typeof analytics._integrations.Intercom.options.appId !== 'undefined') {
                        return analytics._integrations.Intercom.options.appId;
                    } else {
                        return '';
                    }
                }

                per_app_intercom_widget = 'https://widget.intercom.io/widget/' + getAppId();
                var script_tag = document.createElement('script');
                script_tag.type = 'text/javascript';
                script_tag.async = true;
                script_tag.src = per_app_intercom_widget;

                var existing_script = document.getElementsByTagName('script')[0];
                existing_script.parentNode.insertBefore(script_tag, existing_script);
            })();

        <script>
            (function () {
                var MAX_WAIT = 10000;
                var MAX_RETRIES = 3;
                var KEY = 'evo_boot_retry';

                function isAppStarted() {
                    return window.angular && document.querySelector('[ng-controller]');
                }

                function startWatch() {
                    setTimeout(function () {
                        if (isAppStarted()) return;

                        var tries = parseInt(sessionStorage.getItem(KEY) || '0', 10);

                        if (tries < MAX_RETRIES) {
                            sessionStorage.setItem(KEY, tries + 1);
                            location.reload();
                        } else {
                            sessionStorage.removeItem(KEY);
                        }
                    }, MAX_WAIT);
                }

                // Garante que o DOM jÃ¡ existe
                if (document.readyState === 'complete') {
                    startWatch();
                } else {
                    window.addEventListener('load', startWatch);
                }
            })();
        </script>
