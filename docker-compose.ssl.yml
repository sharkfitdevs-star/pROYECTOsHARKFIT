version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl/certs:/etc/nginx/ssl:ro
      - ./docker/ssl/certbot/www:/var/www/certbot:ro
    depends_on:
      - landing
      - users-microservice
      - backend-data-intake
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  users-microservice:
    build:
      context: ./users-microservice
      dockerfile: Dockerfile
    expose:
      - "4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - redis
    restart: unless-stopped

  backend-data-intake:
    build:
      context: ./backend-data-intake
      dockerfile: Dockerfile
    expose:
      - "3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGODB_URI=${MONGODB_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EVO_BASE_URL=${EVO_BASE_URL}
      - EVO_TOKEN=${EVO_TOKEN}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    volumes:
      - intake_logs:/app/logs
      - intake_uploads:/app/uploads
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
  intake_logs:
  intake_uploads:
